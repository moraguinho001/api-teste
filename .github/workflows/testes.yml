# ============================================================
# O semaforo
# ============================================================
# Roda a cada push. Pega os testes oficiais do repositorio de
# referencia do professor e roda contra o seu codigo.
# Voce nao precisa mexer neste arquivo.
# ============================================================

name: Testes da API

on: push

jobs:
  testar:
    # No proprio template o codigo esta vazio de proposito,
    # entao nao faz sentido rodar os testes aqui.
    if: github.repository != 'Srdiegoibs/backend-i-template'
    runs-on: ubuntu-latest
    steps:
      - name: Pega o codigo do aluno
        uses: actions/checkout@v4

      - name: Instala o Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instala as dependencias
        run: npm install

      - name: Baixa os testes oficiais
        uses: actions/checkout@v4
        with:
          repository: Srdiegoibs/backend-i-referencia
          path: .testes-oficiais

      - name: Roda os testes ate a aula declarada no arquivo AULA
        run: |
          # Inicia o servidor em background e aguarda ate 15s pela porta 3000
          npm start &

          TIMEOUT=15
          WAITED=0
          until curl -sSf --connect-timeout 1 --max-time 2 http://localhost:3000/treinos >/dev/null 2>&1; do
            if [ "$WAITED" -ge "$TIMEOUT" ]; then
              echo "Erro: servidor nao respondeu em http://localhost:3000/treinos apos ${TIMEOUT}s"
              exit 1
            fi
            sleep 1
            WAITED=$((WAITED + 1))
          done

          AULA=$(tr -d '[:space:]' < AULA)
          echo "Testando ate a aula $AULA"
          for n in $(seq 2 "$AULA"); do
            arquivo=$(printf ".testes-oficiais/testes/aula%02d.test.js" "$n")
            if [ -f "$arquivo" ]; then
              echo "--- aula $n ---"
              node --test "$arquivo"
            fi
          done
