<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Diário de Treinos: uma lista de treinos criada com componentes e props."
    />
    <title>Diário de Treinos</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17231d;
        background: #f3f6f2;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
      }

      .page {
        width: min(100% - 40px, 920px);
        margin: 0 auto;
        padding: 72px 0;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #347653;
        font-size: 0.78rem;
        font-weight: 750;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 6vw, 3.75rem);
        letter-spacing: -0.055em;
        line-height: 1.05;
      }

      .intro {
        max-width: 540px;
        margin: 16px 0 42px;
        color: #66736b;
        font-size: 1.05rem;
        line-height: 1.65;
      }

      .section-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      h2 {
        margin: 0;
        font-size: 1.1rem;
      }

      .count {
        color: #748078;
        font-size: 0.88rem;
      }

      .workout-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
        gap: 14px;
      }

      .workout {
        display: flex;
        align-items: center;
        gap: 16px;
        min-height: 112px;
        padding: 20px;
        border: 1px solid #e1e8e1;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 5px 18px rgb(23 35 29 / 4%);
      }

      .workout-icon {
        display: grid;
        width: 48px;
        height: 48px;
        flex: 0 0 48px;
        place-items: center;
        border-radius: 14px;
        background: #eaf4ed;
        color: #347653;
        font-size: 1.35rem;
      }

      .workout h3 {
        margin: 0 0 6px;
        font-size: 1rem;
      }

      .workout p {
        margin: 0;
        color: #748078;
        font-size: 0.9rem;
      }

      footer {
        margin-top: 40px;
        color: #89938c;
        font-size: 0.82rem;
      }

      @media (max-width: 520px) {
        .page {
          padding: 48px 0;
        }

        .intro {
          margin-bottom: 32px;
        }
      }
    </style>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const treinos = [
        { id: 1, nome: "Peito e triceps", duracao: 90 },
        { id: 2, nome: "Costas e biceps", duracao: 60 },
        { id: 3, nome: "Pernas", duracao: 75 },
      ];

      function Treino({ nome, duracao }) {
        return (
          <article className="workout">
            <span className="workout-icon" aria-hidden="true">✦</span>
            <div>
              <h3>{nome}</h3>
              <p>{duracao} minutos</p>
            </div>
          </article>
        );
      }

      function ListaDeTreinos({ treinos }) {
        return (
          <section aria-labelledby="lista-titulo">
            <div className="section-heading">
              <h2 id="lista-titulo">Seus treinos</h2>
              <span className="count">{treinos.length} treinos</span>
            </div>
            <div className="workout-list">
              {treinos.map((treino) => (
                <Treino
                  key={treino.id}
                  nome={treino.nome}
                  duracao={treino.duracao}
                />
              ))}
            </div>
          </section>
        );
      }

      function App() {
        return (
          <main className="page">
            <p className="eyebrow">Movimento que vira hábito</p>
            <h1>Diário de Treinos</h1>
            <p className="intro">
              Organize sua rotina e acompanhe os treinos que fazem parte da sua semana.
            </p>
            <ListaDeTreinos treinos={treinos} />
            <footer>Exemplos fixos para a aula de componentes e props.</footer>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
